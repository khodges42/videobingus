name: ambient_feedback
description: Slow autonomous image systems with cumulative, restrained audio response.
composition:
  mode: auto
  footage_weight: 0.35
  generated_weight: 0.65
  scene_duration:
  - 45
  - 180
  motif_recurrence: 0.4
identity:
  palette_family:
  - pastel
  - deep_space
  - archival
  palette_scope: track
  motion: 0.15
  geometric_bias: 0.2
  complexity: 0.55
generators:
- type: recursive_geometry
  weight: 3
  params:
    speed: 0.12
- type: reaction_diffusion
  weight: 2
  params:
    speed: 0.2
- type: domain_warp
  weight: 2
  params:
    speed: 0.12
- type: flow_field
  weight: 2
  params:
    speed: 0.12
- type: fluid_advection
  weight: 2
  params:
    speed: 0.15
effects:
  persistent:
    choose:
    - 0
    - 2
    pool:
    - type: optical_feedback
      intensity:
      - 0.1
      - 0.2
      mode: normal
      gain: 0.9
      injection: 0.15
    - type: signal_delay
      intensity:
      - 0.08
      - 0.18
  per_scene:
    choose:
    - 0
    - 1
    pool:
    - type: display
      intensity:
      - 0.05
      - 0.15
  events:
    max_active: 0
    pool: []
transitions:
- type: analog_crossfade
  weight: 5
  duration:
  - 1
  - 3
audio_response:
  enabled: true
  profiles:
  - slow_breathing
  - energy_accumulation
  preserve_quiet_sections: true
randomization:
  max_global_effects: 2
  max_scene_effects: 2
  max_simultaneous_events: 2
  max_expensive_processors: 1
  max_overlays: 2
  preserve_palette: true
  intensity: 0.4
performance:
  quality: balanced
