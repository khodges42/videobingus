name: deep_space
description: Dark mathematical exploration with extended scenes and smooth motion.
composition:
  mode: auto
  footage_weight: 0.35
  generated_weight: 0.65
  scene_duration:
  - 30
  - 100
  motif_recurrence: 0.4
identity:
  palette_family:
  - deep_space
  - ultraviolet
  palette_scope: track
  motion: 0.25
  geometric_bias: 0.5
  complexity: 0.55
generators:
- type: strange_attractor
  weight: 3
- type: fractal
  weight: 2
- type: starfield
  weight: 2
- type: domain_warp
  weight: 2
- type: flow_field
  weight: 1
effects:
  persistent:
    choose:
    - 0
    - 1
    pool:
    - type: feedback
      intensity:
      - 0.1
      - 0.2
  per_scene:
    choose:
    - 0
    - 1
    pool:
    - type: display
      intensity:
      - 0.05
      - 0.15
      bloom: 0.2
      mask: 0
  events:
    max_active: 0
    pool: []
transitions:
- type: analog_crossfade
  weight: 5
  duration:
  - 1
  - 3
audio_response:
  enabled: true
  profiles:
  - slow_breathing
  - spectral_color
  - energy_accumulation
  preserve_quiet_sections: true
randomization:
  max_global_effects: 2
  max_scene_effects: 2
  max_simultaneous_events: 2
  max_expensive_processors: 1
  max_overlays: 2
  preserve_palette: true
  intensity: 0.6
performance:
  quality: balanced
